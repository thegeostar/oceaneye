<!DOCTYPE html> <!-- HTML5 doctype -->
<html lang="en"> <!-- page language -->

<head>
    <meta charset="UTF-8"> <!-- UTF-8 -->
    <title>Reset Password - Underwater Image Enhancement and Object Detection System</title> <!-- page heading -->
    <style>
        /* base page style */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif; /* Arial, sans-serif */
            background-color: #9090909a; /* background, matching the login page */
            display: flex; /* flexbox layout */
            justify-content: center; /* horizontally centred */
            align-items: center; /* vertically centred */
            height: 100vh; /* viewport height */
        }

        /* login card */
        .login-container {
            background-color: #333; /* dark background, matching the login page */
            padding: 40px; /* padding */
            border-radius: 8px; /* corner radius */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* shadow */
            width: 300px; /* width */
            color: white; /* text colour */
        }

        /* card heading */
        .login-container h2 {
            text-align: center; /* centred text */
            margin: 0 0 20px; /* margin */
            color: white; /* text colour, matching the login page */
        }

        /* form group */
        .form-group {
            margin-bottom: 20px; /* bottom margin */
        }

        /* form label */
        .form-group label {
            display: block; /* block level */
            margin-bottom: 5px; /* bottom margin */
            color: white; /* text colour, matching the login page */
        }

        /* text and password inputs */
        .form-group input[type="text"], 
        .form-group input[type="password"] {
            width: 100%; /* width */
            padding: 10px; /* padding */
            border: 1px solid #ddd; /* border */
            border-radius: 4px; /* corner radius */
            box-sizing: border-box; /* box sizing */
            background-color: #555; /* background colour */
            color: white; /* text colour */
        }

        /* hint text */
        .form-group input[type="text"]::placeholder, 
        .form-group input[type="password"]::placeholder {
            color: #aaa; /* hint colour */
        }

        /* button */
        .form-group button {
            width: 100%; /* width */
            padding: 10px; /* padding */
            background-color: #4c4365; /* background colour */
            border: none; /* no border */
            border-radius: 4px; /* corner radius */
            color: white; /* text colour */
            cursor: pointer; /* cursor */
            font-size: 16px; /* font size */
        }

        /* button hover */
        .form-group button:hover {
            background-color: #372f4f; /* background change */
        }

        /* footer links */
        .form-links {
            text-align: center; /* centred text */
            margin-top: 20px; /* top margin */
        }

        /* link */
        .form-links a {
            margin: 0 5px; /* horizontal margin */
            color: #007bff; /* text colour */
            text-decoration: none; /* no underline */
        }

        /* link hover */
        .form-links a:hover {
            text-decoration: underline; /* underline */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Reset Password</h2>
        <form id="resetPasswordForm">
            <!-- username field -->
            <div class="form-group">
                <label for="resetUsername">Username</label>
                <input type="text" id="resetUsername" name="resetUsername" placeholder="Enter your username" required>
            </div>
            <!-- new password field -->
            <div class="form-group">
                <label for="resetNewPassword">New password</label>
                <input type="password" id="resetNewPassword" name="resetNewPassword" placeholder="Enter your new password" required>
            </div>
            <!-- reset-password button -->
            <div class="form-group">
                <button type="submit">Reset Password</button>
            </div>
            <!-- back-to-login link -->
            <div class="form-links">
                <a href="{{ url_for('login_page') }}">Back to login</a>
            </div>
        </form>
    </div>
    <!-- JavaScript behaviour -->
    <script>
        // reset-password form submit
        document.getElementById('resetPasswordForm').addEventListener('submit', function(event) {
            event.preventDefault(); // stop the form submitting normally
            // read the username and new password
            const resetUsername = document.getElementById('resetUsername').value;
            const resetNewPassword = document.getElementById('resetNewPassword').value;

            // send the reset request
            fetch('/reset_password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username: resetUsername, new_password: resetNewPassword })
            })
            .then(response => response.json())
            .then(data => {
                // reset worked
                if (data.success) {
                    alert('Password reset. Please log in.');
                    window.location.href = '/login';  // go to the login page
                } else {
                    // reset failed
                    alert('Password reset failed: ' + data.message);
                }
            })
            .catch(error => {
                // network or server error
                console.error('Password reset error:', error);
            });
        });
    </script>
</body>
</html>
