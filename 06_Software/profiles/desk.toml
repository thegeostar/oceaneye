# desk.toml - no camera, no model, no internet.
# Everything runs against a generated scene, so the software can be built and
# rehearsed before any hardware arrives. Start here.
#
#   python oceaneye_demo.py --profile desk --max-frames 200

[capture]
source = "synthetic"
width  = 1280
height = 720
fps    = 30

[model]
path = "mock"          # no weights; the screen says so in red
conf = 0.35
track = true

[display]
enhance = false        # the synthetic scene is already clean
hud_scale = 1.0

[session]
outdir = "runs"
log = true
